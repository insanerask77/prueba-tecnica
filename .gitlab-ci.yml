# This file is a template, and some variables might need to be set in the GitLab UI.
# For example, DOCKER_AUTH_CONFIG or individual user/password variables for the registry.

variables:
  # The image name is based on the GitLab project path.
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  LATEST_IMAGE_TAG: $CI_REGISTRY_IMAGE:latest

stages:
  - lint
  - test
  - build
  - deploy

# --- Linting Stage ---
# Checks for Python code style issues.
lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - flake8 src/ tests/
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip

# --- Testing Stage ---
# Runs unit tests for the application.
test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - pytest
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  artifacts:
    when: always
    reports:
      junit: report.xml # Assuming pytest is configured to produce a JUnit report

# --- Build Stage ---
# Builds and pushes the Docker image to the GitLab Container Registry.
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    # $CI_REGISTRY_USER and $CI_REGISTRY_PASSWORD are predefined GitLab CI variables.
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    # If on the main branch, also tag the image as 'latest' for easy deployment.
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag "$IMAGE_TAG" "$LATEST_IMAGE_TAG"
        docker push "$LATEST_IMAGE_TAG"
      fi
  only:
    - branches

# --- Deploy Stage ---
# Deploys the application to the EC2 instance using the shell runner.
deploy:
  stage: deploy
  # This tag is crucial. It ensures this job runs on the specific runner
  # configured on the EC2 instance. The tag name must match the one
  # configured for the runner.
  tags:
    - shell
    - ec2-runner
  script:
    # Set the environment variable for the image tag in docker-compose.
    # This tells docker-compose to use the 'latest' image from the registry.
    - export WEB_IMAGE_TAG=$LATEST_IMAGE_TAG
    # Pull the latest images for the services defined in docker-compose.
    - docker-compose pull
    # Stop the current services, remove them, and start them again in detached mode.
    # --force-recreate ensures that containers are recreated even if their
    # configuration hasn't changed, which is what we want for a new image version.
    - docker-compose up -d --force-recreate
    # Optional: Clean up old, unused Docker images to save space.
    - docker image prune -f
  environment:
    name: production
    url: http://15.237.213.190 # The IP from the prompt
  only:
    - main
